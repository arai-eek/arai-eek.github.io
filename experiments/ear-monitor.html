<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAR Monitor - Environmental Artistic Research</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://bernii.github.io/gauge.js/dist/gauge.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'logo' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)) {
            document.documentElement.setAttribute('data-theme', 'logo');
        }
    </script>
    <style>
        :root {
            /* Theme 1: Arai-eek Cyber (Default) */
            --theme-primary: #ff2a5f;
            --theme-secondary: #00ff88;
            --theme-tertiary: #00d2ff;
            --theme-primary-rgb: 255, 42, 95;
            --theme-secondary-rgb: 0, 255, 136;
            --theme-tertiary-rgb: 0, 210, 255;
            --theme-bg: #0a0f12;
            --theme-bg-darker: rgba(20, 25, 30, 0.4);
            --theme-text-glow: 0 0 10px rgba(var(--theme-primary-rgb), 0.7);
            --theme-blue-glow: 0 0 10px rgba(var(--theme-secondary-rgb), 0.5),
                        0 0 20px rgba(var(--theme-secondary-rgb), 0.3),
                        0 0 30px rgba(var(--theme-secondary-rgb), 0.1);
            --theme-border: var(--theme-secondary);
            --scale-factor: 0.8;
        }

        [data-theme="logo"] {
            /* Theme 2: Logo Style */
            --theme-primary: #ED1C24; /* Red */
            --theme-secondary: #2E3192; /* Navy */
            --theme-tertiary: #00a651; /* Green */
            --theme-primary-rgb: 237, 28, 36;
            --theme-secondary-rgb: 46, 49, 146;
            --theme-tertiary-rgb: 0, 166, 81;
            --theme-bg: #f0f4f8;
            --theme-bg-darker: #ffffff;
            --theme-text-glow: none;
            --theme-blue-glow: 0 8px 24px rgba(46, 49, 146, 0.08);
            --theme-border: rgba(46, 49, 146, 0.2);
        }
        
        html {
            height: 100%;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: var(--theme-bg);
            color: var(--theme-secondary);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
            text-shadow: var(--theme-text-glow);
            transform: scale(var(--scale-factor));
            transform-origin: top center;
            height: calc(100% / var(--scale-factor));
            width: calc(100% / var(--scale-factor));
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) scale(var(--scale-factor));
            transition: background-color 0.5s, color 0.5s, text-shadow 0.5s;
        }

        .container {
            max-width: calc(1200px / var(--scale-factor));
            margin: 0 auto;
            padding: 20px;
            background: var(--theme-bg-darker);
            border: 1px solid var(--theme-border);
            box-shadow: var(--theme-blue-glow);
            border-radius: 10px;
            box-sizing: border-box;
            transition: background 0.5s, border-color 0.5s, box-shadow 0.5s;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            color: var(--theme-secondary);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
            font-size: 1.6em;
            text-shadow: 0 0 20px rgba(var(--theme-secondary-rgb), 0.9);
            font-weight: 700;
            line-height: 1.4;
            transition: color 0.5s, text-shadow 0.5s;
        }

        h1 .location {
            display: block;
            color: var(--theme-primary);
            font-size: 0.9em;
            margin-top: 5px;
            text-shadow: var(--theme-text-glow);
            transition: color 0.5s, text-shadow 0.5s;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .last-update {
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--theme-secondary);
            transition: color 0.5s;
        }

        .refresh-button {
            background: var(--theme-bg-darker);
            color: var(--theme-primary);
            border: 1px solid var(--theme-border);
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            margin-left: 10px;
            transition: all 0.3s ease;
        }

        .refresh-button:hover {
            animation: glow 2s infinite;
        }

        @keyframes glow {
            0% { box-shadow: 0 0 10px var(--theme-primary); }
            50% { box-shadow: 0 0 20px var(--theme-secondary); }
            100% { box-shadow: 0 0 10px var(--theme-primary); }
        }

        /* Theme Toggle Switch */
        .theme-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-label {
            font-size: 0.85em;
            color: var(--theme-secondary);
            transition: color 0.5s;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.5;
        }

        :root .theme-label.lanna { opacity: 1; font-weight: bold; text-shadow: var(--theme-text-glow); }
        :root .theme-label.araieek { opacity: 0.5; font-weight: normal; text-shadow: none; }

        :root[data-theme="logo"] .theme-label.lanna { opacity: 0.5; font-weight: normal; text-shadow: none; }
        :root[data-theme="logo"] .theme-label.araieek { opacity: 1; font-weight: bold; text-shadow: none; }

        .theme-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 20px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--theme-bg-darker);
            border: 1px solid var(--theme-primary);
            transition: .4s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: var(--theme-primary);
            transition: .4s;
            border-radius: 50%;
            box-shadow: 0 0 5px var(--theme-primary);
        }

        input:checked + .slider {
            background-color: var(--theme-bg-darker);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .data-card {
            background: var(--theme-bg-darker);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--theme-border);
            box-shadow: var(--theme-blue-glow);
            margin-bottom: 20px;
            box-sizing: border-box;
            width: 100%;
            transition: all 0.5s;
        }

        h2 {
            color: var(--theme-secondary);
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.5s;
        }

        .current-values {
            padding: 20px;
        }

        .readings-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 40px;
        }

        .value-card {
            background: var(--theme-bg-darker);
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid var(--theme-border);
            box-shadow: var(--theme-blue-glow);
            min-width: 150px;
            flex: 1;
            transition: all 0.5s;
        }

        .value-card h3 {
            margin: 0;
            color: var(--theme-primary);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.5s;
        }

        .value-card p {
            margin: 10px 0 0;
            font-size: 1.8em;
            font-weight: bold;
            color: var(--theme-secondary);
            text-shadow: var(--theme-blue-glow);
            transition: all 0.5s;
        }

        .gauge-container {
            text-align: center;
            width: 100%;
            max-width: 250px;
            flex: 1;
        }

        canvas.gauge-canvas {
            width: 100% !important;
            height: 150px !important;
            margin: 0 auto;
        }

        .gauge-label {
            margin-top: 10px;
            font-weight: bold;
            color: var(--theme-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9em;
            transition: color 0.5s;
        }

        .gauge-value {
            margin-top: 5px;
            font-size: 1.8em;
            font-weight: bold;
            color: var(--theme-secondary);
            text-shadow: var(--theme-blue-glow);
            transition: all 0.5s;
        }

        .chart-container {
            position: relative;
            height: 350px;
            background: var(--theme-bg-darker);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--theme-secondary);
            box-shadow: var(--theme-blue-glow);
            width: 100%;
            box-sizing: border-box;
            min-width: 0;
            transition: all 0.5s;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
            width: 100%;
            box-sizing: border-box;
        }

        .chart-wrapper {
            min-width: 0;
            width: 100%;
            box-sizing: border-box;
        }

        @media (max-width: 768px) {
            body {
                --scale-factor: 1;
                transform: none;
                width: 100%;
                height: 100%;
                position: static;
                left: 0;
                padding: 10px;
            }

            .container {
                max-width: 100%;
                padding: 15px;
            }

            .value-card {
                width: 100%;
            }

            .chart-container {
                height: 300px;
                padding: 10px;
            }

            h1 {
                font-size: 1.2em;
            }
        }

        @media (max-width: 620px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 250px;
            }

            .readings-container {
                flex-direction: column;
                gap: 20px;
            }
        }

        #errorContainer {
            color: var(--theme-primary);
            margin-bottom: 20px;
            text-shadow: var(--theme-text-glow);
        }

        #lastUpdateContainer {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8em;
            text-align: center;
            margin-top: 20px;
            color: var(--theme-secondary);
            transition: color 0.5s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-bar">
            <span class="last-update">Last updated: <span id="lastUpdate">Never</span></span>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="theme-switch-wrapper">
                    <span class="theme-label lanna">Cyber</span>
                    <label class="theme-switch" for="themeToggle">
                        <input type="checkbox" id="themeToggle" onclick="toggleTheme()" />
                        <span class="slider"></span>
                    </label>
                    <span class="theme-label araieek">Logo</span>
                </div>
                <button class="refresh-button" onclick="fetchData(true)">Refresh Now</button>
            </div>
        </div>

        <h1>
            EAR Monitor
            <span class="location">Environmental Artistic Research</span>
        </h1>
        
        <div id="errorContainer" class="error" style="display: none;">
            <p id="errorMessage"></p>
        </div>

        <div id="dataContainer">
            <div class="data-card">
                <h2>Latest Values</h2>
                <div class="current-values">
                    <div class="readings-container">
                        <div class="gauge-container">
                            <canvas id="tempGauge" class="gauge-canvas"></canvas>
                            <div class="gauge-label">Temperature</div>
                            <div id="latestTemp" class="gauge-value">Loading...</div>
                        </div>
                        <div class="gauge-container">
                            <canvas id="co2Gauge" class="gauge-canvas"></canvas>
                            <div class="gauge-label">CO2</div>
                            <div id="latestCO2" class="gauge-value">Loading...</div>
                        </div>
                        <div class="gauge-container">
                            <canvas id="humGauge" class="gauge-canvas"></canvas>
                            <div class="gauge-label">Humidity</div>
                            <div id="latestHum" class="gauge-value">Loading...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-wrapper">
                    <div class="chart-container">
                        <canvas id="tempChartHistory"></canvas>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <div class="chart-container">
                        <canvas id="co2ChartHistory"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="charts-grid">
                <div class="chart-wrapper">
                    <div class="chart-container">
                        <canvas id="humChartHistory"></canvas>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <div class="chart-container">
                        <canvas id="batteryChartHistory"></canvas>
                    </div>
                </div>
            </div>

            <div id="lastUpdateContainer">
                Last update: <span id="lastUpdateFooter"></span>
            </div>
        </div>

        <script>
            let tempChartHistory = null;
            let co2ChartHistory = null;
            let humChartHistory = null;
            let batteryChartHistory = null;
            
            let tempGauge = null;
            let co2Gauge = null;
            let humGauge = null;

            const THINGSPEAK_CHANNEL = "1718702";
            const THAILAND_OFFSET = 7 * 60 * 60 * 1000; // 7 hours in ms

            function getThemeColors() {
                const root = document.documentElement;
                const computed = getComputedStyle(root);
                return {
                    primary: computed.getPropertyValue('--theme-primary').trim(),
                    secondary: computed.getPropertyValue('--theme-secondary').trim(),
                    tertiary: computed.getPropertyValue('--theme-tertiary').trim(),
                    primaryRgb: computed.getPropertyValue('--theme-primary-rgb').trim(),
                    secondaryRgb: computed.getPropertyValue('--theme-secondary-rgb').trim(),
                    tertiaryRgb: computed.getPropertyValue('--theme-tertiary-rgb').trim(),
                };
            }

            function toggleTheme() {
                const root = document.documentElement;
                let newTheme;
                if (root.getAttribute('data-theme') === 'logo') {
                    root.removeAttribute('data-theme');
                    newTheme = 'default';
                } else {
                    root.setAttribute('data-theme', 'logo');
                    newTheme = 'logo';
                }
                
                localStorage.setItem('theme', newTheme);
                updateThemeVisuals();
            }

            document.addEventListener('DOMContentLoaded', () => {
                const toggle = document.getElementById('themeToggle');
                if (toggle && document.documentElement.getAttribute('data-theme') === 'logo') {
                    toggle.checked = true;
                }
                
                initGauges();
                fetchData();
                // Refresh every 5 minutes
                setInterval(() => fetchData(), 5 * 60 * 1000);
            });
            
            function createGaugeOptions(colors, primaryColorHex, primaryColorRgb, min, max, zones) {
                return {
                    angle: -0.2,
                    lineWidth: 0.2,
                    radiusScale: 0.9,
                    pointer: {
                        length: 0.6,
                        strokeWidth: 0.035,
                        color: colors.primary
                    },
                    staticLabels: {
                        font: "10px Orbitron",
                        labels: [min, ...zones.map(z => z.max)],
                        color: colors.secondary,
                        fractionDigits: 0
                    },
                    staticZones: zones,
                    limitMax: true,
                    limitMin: true,
                    highDpiSupport: true,
                    renderTicks: {
                        divisions: 4,
                        divWidth: 1.1,
                        divLength: 0.7,
                        divColor: colors.secondary,
                        subDivisions: 3,
                        subLength: 0.5,
                        subWidth: 0.6,
                        subColor: `rgba(${colors.secondaryRgb}, 0.5)`
                    }
                };
            }

            function updateThemeVisuals() {
                const colors = getThemeColors();
                
                // Update Gauge Options
                if (tempGauge) {
                    const zones = [
                        {strokeStyle: `rgba(${colors.tertiaryRgb}, 0.5)`, min: 0, max: 15},
                        {strokeStyle: `rgba(${colors.secondaryRgb}, 0.5)`, min: 15, max: 25},
                        {strokeStyle: `rgba(${colors.primaryRgb}, 0.5)`, min: 25, max: 35},
                        {strokeStyle: `rgba(${colors.primaryRgb}, 0.9)`, min: 35, max: 50}
                    ];
                    tempGauge.setOptions(createGaugeOptions(colors, colors.secondary, colors.secondaryRgb, 0, 50, zones));
                    tempGauge.set(tempGauge.value || 0);
                }
                
                if (co2Gauge) {
                    const zones = [
                        {strokeStyle: `rgba(${colors.secondaryRgb}, 0.5)`, min: 400, max: 800},
                        {strokeStyle: `rgba(${colors.tertiaryRgb}, 0.7)`, min: 800, max: 1200},
                        {strokeStyle: `rgba(${colors.primaryRgb}, 0.5)`, min: 1200, max: 2000},
                        {strokeStyle: `rgba(${colors.primaryRgb}, 0.9)`, min: 2000, max: 5000}
                    ];
                    co2Gauge.setOptions(createGaugeOptions(colors, colors.primary, colors.primaryRgb, 400, 5000, zones));
                    co2Gauge.set(co2Gauge.value || 400);
                }
                
                if (humGauge) {
                    const zones = [
                        {strokeStyle: `rgba(${colors.primaryRgb}, 0.5)`, min: 0, max: 30},
                        {strokeStyle: `rgba(${colors.secondaryRgb}, 0.5)`, min: 30, max: 60},
                        {strokeStyle: `rgba(${colors.tertiaryRgb}, 0.7)`, min: 60, max: 80},
                        {strokeStyle: `rgba(${colors.primaryRgb}, 0.9)`, min: 80, max: 100}
                    ];
                    humGauge.setOptions(createGaugeOptions(colors, colors.tertiary, colors.tertiaryRgb, 0, 100, zones));
                    humGauge.set(humGauge.value || 0);
                }

                // Function to update chart colors
                const updateChartTheme = (chart, color, colorRgb) => {
                    if (chart) {
                        chart.data.datasets[0].borderColor = color;
                        chart.data.datasets[0].pointBackgroundColor = color;
                        chart.data.datasets[0].backgroundColor = `rgba(${colorRgb}, 0.1)`;
                        chart.options.plugins.title.color = colors.secondary;
                        chart.options.plugins.legend.labels.color = colors.secondary;
                        chart.options.scales.x.ticks.color = colors.secondary;
                        chart.options.scales.x.title.color = colors.secondary;
                        chart.options.scales.y.ticks.color = colors.secondary;
                        chart.options.scales.x.grid.color = `rgba(${colors.secondaryRgb}, 0.1)`;
                        chart.options.scales.y.grid.color = `rgba(${colors.secondaryRgb}, 0.1)`;
                        chart.update();
                    }
                };
                
                updateChartTheme(tempChartHistory, colors.secondary, colors.secondaryRgb);
                updateChartTheme(co2ChartHistory, colors.primary, colors.primaryRgb);
                updateChartTheme(humChartHistory, colors.tertiary, colors.tertiaryRgb);
                updateChartTheme(batteryChartHistory, colors.secondary, colors.secondaryRgb);
            }

            function initGauges() {
                tempGauge = new Gauge(document.getElementById('tempGauge')).setOptions({
                    angle: -0.2, lineWidth: 0.2, radiusScale: 0.9,
                    pointer: { length: 0.6, strokeWidth: 0.035, color: '#000000' }
                });
                tempGauge.maxValue = 50; tempGauge.setMinValue(0); tempGauge.animationSpeed = 32;
                
                co2Gauge = new Gauge(document.getElementById('co2Gauge')).setOptions({
                    angle: -0.2, lineWidth: 0.2, radiusScale: 0.9,
                    pointer: { length: 0.6, strokeWidth: 0.035, color: '#000000' }
                });
                co2Gauge.maxValue = 5000; co2Gauge.setMinValue(400); co2Gauge.animationSpeed = 32;
                
                humGauge = new Gauge(document.getElementById('humGauge')).setOptions({
                    angle: -0.2, lineWidth: 0.2, radiusScale: 0.9,
                    pointer: { length: 0.6, strokeWidth: 0.035, color: '#000000' }
                });
                humGauge.maxValue = 100; humGauge.setMinValue(0); humGauge.animationSpeed = 32;

                updateThemeVisuals(); 
            }

            function createChart(ctxId, chartObj, label, dataX, dataY, color, colorRgb, title) {
                const colors = getThemeColors();
                const ctx = document.getElementById(ctxId);
                
                if (chartObj) {
                    chartObj.destroy();
                }
                
                const chartOptions = {
                    type: 'line',
                    data: {
                        labels: dataX,
                        datasets: [{
                            label: label,
                            data: dataY,
                            borderColor: color,
                            backgroundColor: `rgba(${colorRgb}, 0.1)`,
                            borderWidth: 2,
                            pointRadius: 1,
                            pointBackgroundColor: color,
                            tension: 0.4,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: title, color: colors.secondary, font: { family: 'Orbitron', size: 14 } },
                            legend: { labels: { color: colors.secondary, font: { family: 'Orbitron' } } },
                            tooltip: { mode: 'index', intersect: false }
                        },
                        scales: {
                            x: {
                                type: 'category',
                                grid: { color: `rgba(${colors.secondaryRgb}, 0.1)` },
                                ticks: { color: colors.secondary, font: { family: 'Orbitron' }, maxTicksLimit: 10 }
                            },
                            y: {
                                grid: { color: `rgba(${colors.secondaryRgb}, 0.1)` },
                                ticks: { color: colors.secondary, font: { family: 'Orbitron' } }
                            }
                        }
                    }
                };
                return new Chart(ctx, chartOptions);
            }

            async function fetchData(manualRefresh = false) {
                try {
                    const response = await fetch(`https://api.thingspeak.com/channels/${THINGSPEAK_CHANNEL}/feeds.json?results=288`);
                    if (!response.ok) throw new Error('Failed to fetch from ThingSpeak');
                    const data = await response.json();
                    
                    if (!data.feeds || data.feeds.length === 0) {
                        throw new Error('No data available.');
                    }
                    
                    const feeds = data.feeds;
                    const latest = feeds[feeds.length - 1];
                    
                    // Values
                    const temp = parseFloat(latest.field1);
                    const co2 = parseFloat(latest.field3);
                    const hum = parseFloat(latest.field4);
                    
                    // Update Gauges & Text
                    if (!isNaN(temp)) {
                        tempGauge.set(temp);
                        document.getElementById('latestTemp').textContent = `${temp.toFixed(1)} °C`;
                    }
                    if (!isNaN(co2)) {
                        co2Gauge.set(co2);
                        document.getElementById('latestCO2').textContent = `${co2.toFixed(0)} ppm`;
                    }
                    if (!isNaN(hum)) {
                        humGauge.set(hum);
                        document.getElementById('latestHum').textContent = `${hum.toFixed(1)} %`;
                    }
                    
                    // Time processing
                    const latestTime = new Date(latest.created_at);
                    const formatTime = (dateStr) => {
                        const localD = new Date(dateStr);
                        const month = (localD.getMonth() + 1).toString().padStart(2, '0');
                        const day = localD.getDate().toString().padStart(2, '0');
                        const hours = localD.getHours().toString().padStart(2, '0');
                        const mins = localD.getMinutes().toString().padStart(2, '0');
                        return `${month}-${day} ${hours}:${mins}`;
                    };
                    
                    const timeStr = formatTime(latestTime);
                    document.getElementById('lastUpdate').textContent = timeStr;
                    document.getElementById('lastUpdateFooter').textContent = timeStr;
                    document.getElementById('errorContainer').style.display = 'none';
                    
                    // Extract data for charts
                    const timestamps = [];
                    const tempHist = [];
                    const co2Hist = [];
                    const humHist = [];
                    const battHist = [];
                    
                    feeds.forEach(f => {
                        timestamps.push(formatTime(f.created_at));
                        tempHist.push(f.field1 ? parseFloat(f.field1) : null);
                        co2Hist.push(f.field3 ? parseFloat(f.field3) : null);
                        humHist.push(f.field4 ? parseFloat(f.field4) : null);
                        battHist.push(f.field6 ? parseFloat(f.field6) : null);
                    });
                    
                    const colors = getThemeColors();
                    tempChartHistory = createChart('tempChartHistory', tempChartHistory, 'Temperature (°C)', timestamps, tempHist, colors.secondary, colors.secondaryRgb, 'Temperature History');
                    co2ChartHistory = createChart('co2ChartHistory', co2ChartHistory, 'CO2 (ppm)', timestamps, co2Hist, colors.primary, colors.primaryRgb, 'CO2 History');
                    humChartHistory = createChart('humChartHistory', humChartHistory, 'Humidity (%)', timestamps, humHist, colors.tertiary, colors.tertiaryRgb, 'Humidity History');
                    batteryChartHistory = createChart('batteryChartHistory', batteryChartHistory, 'Battery Level (mV)', timestamps, battHist, colors.secondary, colors.secondaryRgb, 'Battery History');
                    
                } catch (error) {
                    console.error('Error:', error);
                    document.getElementById('errorContainer').style.display = 'block';
                    document.getElementById('errorMessage').textContent = error.message;
                    document.getElementById('lastUpdate').textContent = "Offline";
                    document.getElementById('lastUpdateFooter').textContent = "Offline";
                }
            }
        </script>
    </div>
</body>
</html>
