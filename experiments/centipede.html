const LEG_PIVOT_L = { fx: 0.9085, fy: 0.1758 }; // pivot within kaki_kiri image
const LEG_PIVOT_R = { fx: 0.0914, fy: 0.1760 }; // pivot within kaki_kanan image

const canvas = document.getElementById("c");
const ctx    = canvas.getContext("2d");

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener("resize", resize);

function loadImg(src) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => res(img);
    img.src = src;
  });
}

// ── Segment counts & sizes ──
const NUM_SEGS  = 22;             // body segments
const SPINE_N   = NUM_SEGS + 2;  // + head + tail

// Display sizes in px
const HEAD_W = 130, HEAD_H = 120;
const BODY_W = 90,  BODY_H = 46;
const TAIL_W = 70,  TAIL_H = 101;
const LEG_W  = 72,  LEG_H  = 54;

// Spine joint spacing — tight but stable
const SPINE_SPACING = 22;

// Self-collision avoidance radius per segment
const AVOID_R = 16;

// ── Spine ──
let spine = [];
let headX, headY, wanderAngle;
const SPEED = 2.6;
let t = 0;

function initSpine() {
  headX = canvas.width  * 0.5;
  headY = canvas.height * 0.5;
  wanderAngle = 0;
  spine = [];
  for (let i = 0; i < SPINE_N; i++) {
    spine.push({ x: headX - i * SPINE_SPACING, y: headY });
  }
}

function segScale(i) {
  if (i === 0) return 1.0;
  if (i === SPINE_N - 1) return 0.50;
  return 1.0 - (i / (SPINE_N - 1)) * 0.46;
}

// ── Head steering ──
// Stay WELL inside viewport, turn gradually
const MARGIN   = 90;
const TURN_STR = 0.10;

function updateHead() {
  // Wander
  wanderAngle += (Math.random() - 0.5) * 0.04 + Math.sin(t * 0.009) * 0.018;

  // Hard boundary push — steer back toward center
  const cx = canvas.width  / 2;
  const cy = canvas.height / 2;
  const maxX = canvas.width  - MARGIN;
  const maxY = canvas.height - MARGIN;

  let targetAngle = wanderAngle;
  if (headX < MARGIN)  targetAngle = lerp(wanderAngle, 0,           TURN_STR);
  if (headX > maxX)    targetAngle = lerp(wanderAngle, Math.PI,     TURN_STR);
  if (headY < MARGIN)  targetAngle = lerp(wanderAngle, Math.PI/2,   TURN_STR);
  if (headY > maxY)    targetAngle = lerp(wanderAngle, -Math.PI/2,  TURN_STR);

  wanderAngle = targetAngle;

  // Clamp position absolutely
  headX = Math.max(MARGIN, Math.min(canvas.width  - MARGIN, headX + Math.cos(wanderAngle) * SPEED));
  headY = Math.max(MARGIN, Math.min(canvas.height - MARGIN, headY + Math.sin(wanderAngle) * SPEED));
}

function lerp(a, b, t) { return a + (b - a) * t; }

// ── Spine chain ──
function updateSpine() {
  spine[0].x = headX;
  spine[0].y = headY;
  for (let i = 1; i < SPINE_N; i++) {
    const p = spine[i-1], c = spine[i];
    const d = Math.hypot(c.x - p.x, c.y - p.y);
    if (d > SPINE_SPACING) {
      const a = Math.atan2(c.y - p.y, c.x - p.x);
      c.x = p.x + Math.cos(a) * SPINE_SPACING;
      c.y = p.y + Math.sin(a) * SPINE_SPACING;
    }
  }
}

// ── Self-collision: prevent head from approaching tail segments ──
// We only push the head if it gets too close to body segments (skip first N segments near head)
const SELF_AVOID_START = 5; // ignore first 5 segments (too close naturally)
function selfAvoidance() {
  for (let i = SELF_AVOID_START; i < SPINE_N; i++) {
    const s = spine[i];
    const d = Math.hypot(headX - s.x, headY - s.y);
    if (d < AVOID_R * 3) {
      // Steer away
      const away = Math.atan2(headY - s.y, headX - s.x);
      const pushAng = away;
      wanderAngle = lerp(wanderAngle, pushAng, 0.15);
      break;
    }
  }
}

// ── Draw segment ──
function drawImg(img, cx, cy, w, h, angle) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.drawImage(img, -w/2, -h/2, w, h);
  ctx.restore();
}

// Draw a leg image, placing the pivot point at (pivotX, pivotY),
// rotated by legAngle. pivot = fraction of image (fx, fy)
function drawLeg(img, pivotX, pivotY, w, h, angle, pivotFx, pivotFy) {
  // The pivot is at fraction (pivotFx, pivotFy) of the image.
  // We want that point to sit at (pivotX, pivotY).
  // So offset from center to pivot (in image-local coords before rotation):
  const offX = (pivotFx - 0.5) * w;
  const offY = (pivotFy - 0.5) * h;
  // Center of image in world = pivot - rotated(offX, offY)
  const cosA = Math.cos(angle), sinA = Math.sin(angle);
  const cx = pivotX - (cosA * offX - sinA * offY);
  const cy = pivotY - (sinA * offX + cosA * offY);
  drawImg(img, cx, cy, w, h, angle);
}

function segAngle(i) {
  if (i === 0) return wanderAngle;
  const p = spine[i-1], c = spine[i];
  return Math.atan2(p.y - c.y, p.x - c.x);
}

// ── Main ──
let imgs = null;
async function main() {
  imgs = {
    kepala:     await loadImg(SRC.kepala),
    badan:      await loadImg(SRC.badan),
    ekor:       await loadImg(SRC.ekor),
    kaki_kiri:  await loadImg(SRC.kaki_kiri),
    kaki_kanan: await loadImg(SRC.kaki_kanan),
  };
  initSpine();
  requestAnimationFrame(loop);
}

function loop() {
  t++;
  updateHead();
  selfAvoidance();
  updateSpine();
  draw();
  requestAnimationFrame(loop);
}

const WALK_FREQ  = 0.13;
const LEG_SWING  = 0.55; // max rotation radians

// ── Animated antennae (sungut) — sniffing motion ──
function drawAntennae(hx, hy, headAngle, scale) {
  const segCount = 5;
  const segLen   = 14 * scale;

  // High-frequency wiggle = "sniffing" feel
  const sniffFastL = Math.sin(t * 0.45)        * 0.35
                   + Math.sin(t * 0.71 + 1.3)  * 0.18;
  const sniffFastR = Math.sin(t * 0.43 + 0.7)  * 0.35
                   + Math.sin(t * 0.69 + 2.1)  * 0.18;

  // Antenna roots — slightly forward of head, spread to each side
  const headFwd     = HEAD_H * 0.34 * scale;
  const baseSpread  = HEAD_W * 0.14 * scale;

  const baseLx = hx + Math.cos(headAngle) * headFwd
              + Math.cos(headAngle - Math.PI/2) * baseSpread;
  const baseLy = hy + Math.sin(headAngle) * headFwd
              + Math.sin(headAngle - Math.PI/2) * baseSpread;
  const baseRx = hx + Math.cos(headAngle) * headFwd
              + Math.cos(headAngle + Math.PI/2) * baseSpread;
  const baseRy = hy + Math.sin(headAngle) * headFwd
              + Math.sin(headAngle + Math.PI/2) * baseSpread;

  drawSingleAntenna(baseLx, baseLy, headAngle - 0.45, sniffFastL, segCount, segLen, scale, +1);
  drawSingleAntenna(baseRx, baseRy, headAngle + 0.45, sniffFastR, segCount, segLen, scale, -1);
}

function drawSingleAntenna(bx, by, baseAngle, sniff, segCount, segLen, scale, side) {
  ctx.save();
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  ctx.strokeStyle = '#2e3192';
  ctx.lineWidth   = 4 * scale;
  ctx.shadowColor = 'rgba(255, 30, 30, 0.25)';
  ctx.shadowBlur  = 6;

  let x = bx, y = by;
  let ang = baseAngle;
  ctx.beginPath();
  ctx.moveTo(x, y);
  for (let s = 0; s < segCount; s++) {
    const tipFactor = (s + 1) / segCount;
    const wiggle = sniff * tipFactor * 0.55
                 + Math.sin(t * 0.32 + s * 0.9 + side) * 0.10 * tipFactor;
    ang += side * 0.12 + wiggle;
    x += Math.cos(ang) * segLen;
    y += Math.sin(ang) * segLen;
    ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Glowing red tip — the "smell sensor"
  const tipPulse = 0.6 + 0.4 * Math.sin(t * 0.28 + side);
  ctx.shadowBlur  = 10;
  ctx.shadowColor = 'rgba(255, 60, 60, 0.25)';
  ctx.fillStyle   = '#eb1c24';
  ctx.beginPath();
  ctx.arc(x, y, 4.5 * scale * (0.85 + 0.25 * tipPulse), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function draw() {
  // Slightly stronger trail-fade so the breathing glow doesn't smear
  ctx.fillStyle = "rgba(26,10,0,0.28)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!imgs) return;

  // ── Breathing red glow over the whole body ──
  const breath01  = 0.5 + 0.5 * Math.sin(t * 0.045);
  // Keep blur tiny — shadowBlur is the slowest 2D-canvas op and we have ~50 draws per frame
  const glowBlur  = 5 + 5 * breath01;
  ctx.shadowColor = 'rgba(255, 35, 35, 0.25)';
  ctx.shadowBlur  = glowBlur;

  // Tail → head order so the head paints last
  for (let i = SPINE_N - 1; i >= 0; i--) {
    const s  = spine[i];
    const sc = segScale(i);
    const a  = segAngle(i);
    const und = Math.sin(t * WALK_FREQ - i * 0.48) * 0.03;

    if (i === 0) {
      // HEAD
      drawImg(imgs.kepala, s.x, s.y, HEAD_W * sc, HEAD_H * sc, a + Math.PI/2 + und);

    } else if (i === SPINE_N - 1) {
      // TAIL
      drawImg(imgs.ekor, s.x, s.y, TAIL_W * sc, TAIL_H * sc, a + Math.PI/2 + und);

    } else {
      // ── BODY SEGMENT (top-down view) ──
      const bw = BODY_W * sc, bh = BODY_H * sc;

      // Alternating left/right leg swing — ripple from front to back
      const phase = t * WALK_FREQ - i * 0.52;
      const rotL  = Math.sin(phase)             * LEG_SWING;
      const rotR  = Math.sin(phase + Math.PI)   * LEG_SWING;

      const lw = LEG_W * sc, lh = LEG_H * sc;

      // Legs sit on the TRUE perpendicular sides of the body axis.
      //   `a` = forward direction of this segment (from tail toward head).
      //   In canvas (y-down):  left side = a − π/2,  right side = a + π/2.
      const hideDepth = bw * 0.40; // tuck pivot just under body edge

      const pivLx = s.x + Math.cos(a - Math.PI/2) * hideDepth;
      const pivLy = s.y + Math.sin(a - Math.PI/2) * hideDepth;
      const pivRx = s.x + Math.cos(a + Math.PI/2) * hideDepth;
      const pivRy = s.y + Math.sin(a + Math.PI/2) * hideDepth;

      // ── Legs drawn FIRST → leg layer sits BEHIND body ──
      // Left leg: extends outward to the left of motion
      drawLeg(imgs.kaki_kiri,  pivLx, pivLy, lw, lh,
              a + rotL,
              LEG_PIVOT_L.fx, LEG_PIVOT_L.fy);

      // Right leg: extends outward to the right of motion
      drawLeg(imgs.kaki_kanan, pivRx, pivRy, lw, lh,
              a + Math.PI + rotR,
              LEG_PIVOT_R.fx, LEG_PIVOT_R.fy);

      // Body drawn AFTER legs so it hides the leg pivots
      drawImg(imgs.badan, s.x, s.y, bw, bh, a + Math.PI/2 + und);
    }
  }

  // Sniffing antennae — drawn last so glowing tips sit on top
  const head = spine[0];
  drawAntennae(head.x, head.y, wanderAngle, 1.0);

  // Reset shadow so it doesn't bleed into the next frame's fade rect
  ctx.shadowBlur  = 0;
  ctx.shadowColor = 'transparent';
}

main();
</script>
