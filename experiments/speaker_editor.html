<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clap to COLAB - Speaker Editor</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f0f0f0; }
        .container { display: flex; flex-direction: column; height: 95vh; max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        audio { width: 100%; margin-bottom: 20px; }
        .editor-box { flex-grow: 1; overflow-y: auto; border: 1px solid #ccc; border-radius: 4px; padding: 10px; background: #fafafa; }
        
        .cue-row { display: flex; gap: 10px; padding: 8px; border-bottom: 1px solid #eee; transition: background 0.2s; align-items: flex-start; }
        .cue-row:hover { background: #eef; }
        .cue-row.active { background: #dff0d8; }
        
        .cue-time { font-family: monospace; color: #666; cursor: pointer; white-space: nowrap; padding-top: 4px; user-select: none; }
        .cue-time:hover { color: #0066cc; text-decoration: underline; }
        
        .cue-speaker { display: flex; flex-direction: column; gap: 4px; width: 150px; flex-shrink: 0; }
        .cue-speaker input { width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 4px; font-weight: bold; }
        
        .quick-names { display: flex; flex-wrap: wrap; gap: 4px; }
        .quick-names button { font-size: 10px; padding: 2px 4px; cursor: pointer; background: #eee; border: 1px solid #ccc; border-radius: 3px; }
        .quick-names button:hover { background: #ddd; }
        
        .cue-text { flex-grow: 1; padding-top: 4px; line-height: 1.4; }
        
        .chapter-header { background: #333; color: white; padding: 10px; margin: 15px 0 5px 0; font-weight: bold; border-radius: 4px; }
        
        button.export { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button.export:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>VTT Speaker Editor (Colab 3)</h2>
            <div>
                <input type="file" id="file-upload" accept=".vtt,.srt" style="margin-right: 15px;">
                <button class="export" id="export-btn">💾 Save / Export VTT</button>
            </div>
        </div>
        
        <audio id="audio-player" src="Clap_to_Colab3_kaspar_koenig_260818_14_colaboradio_broadcast.mp3" controls preload="metadata"></audio>
        
        <div class="editor-box" id="editor-box">
            Please select the local .vtt or .srt file using the "Choose File" button above to load the transcript.
        </div>
    </div>

    <script>
        const vttFile = 'Clap_to_Colab3_kaspar_koenig_260818_14_colaboradio_improved.vtt';
        const audio = document.getElementById('audio-player');
        const editorBox = document.getElementById('editor-box');
        
        const chapters = [
            { time: 0, label: "Kaspar König: Show Intro", chars: ["Kaspar"] },
            { time: 141, label: "Workshop Participants: The SCHAISS Workshop", chars: ["Kaspar", "Participant"] },
            { time: 330, label: "🎶 Music (Intermezzo)", chars: [] },
            { time: 421, label: "Pije: Anti-Capitalist Hardware", chars: ["Kaspar", "Pije"] },
            { time: 647, label: "Gandalf & Valentina: Robots and Data Art", chars: ["Kaspar", "Gandalf", "Valentina"] },
            { time: 1011, label: "Flo Kaufmann: Bricolage Universal", chars: ["Kaspar", "Flo"] },
            { time: 1391, label: "🎶 Music (Intermezzo)", chars: [] },
            { time: 1417, label: "Alwin Weber: The Simulation of Utopia", chars: ["Kaspar", "Alwin"] },
            { time: 1673, label: "Olsen: Automotive Pixel Art", chars: ["Kaspar", "Olsen"] },
            { time: 2011, label: "Oli Jäggi: The Origins of Homemade", chars: ["Kaspar", "Oli"] },
            { time: 2270, label: "Taras: Micro-Sound & Touch-Micing", chars: ["Kaspar", "Taras"] },
            { time: 3209, label: "Kaspar König: Outro & Credits", chars: ["Kaspar"] }
        ];

        let cues = [];

        function parseTime(timeStr) {
            const parts = timeStr.replace(',', '.').split(':');
            let h = 0, m = 0, s = 0;
            if (parts.length === 3) {
                h = parseInt(parts[0]); m = parseInt(parts[1]); s = parseFloat(parts[2]);
            } else {
                m = parseInt(parts[0]); s = parseFloat(parts[1]);
            }
            return (h * 3600) + (m * 60) + s;
        }

        function getChapter(seconds) {
            let current = chapters[0];
            for (let ch of chapters) {
                if (seconds >= ch.time) current = ch;
                else break;
            }
            return current;
        }

        document.getElementById('file-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                editorBox.innerHTML = '';
                cues = []; // Reset cues
                const lines = text.split(/\r?\n/);
                
                let currentChapter = null;

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line.includes('-->')) {
                        const timeStr = line;
                        const startStr = line.split('-->')[0].trim();
                        const seconds = parseTime(startStr);
                        
                        // Look ahead for speaker text
                        let j = i + 1;
                        let textBlock = [];
                        let speaker = "Unknown";
                        
                        while (j < lines.length && lines[j].trim() !== "" && !lines[j].includes('-->')) {
                            let dialogue = lines[j].trim();
                            // Handle SRT line numbers preceding timestamp
                            if (!isNaN(dialogue) && dialogue !== "") {
                                j++; continue; 
                            }
                            
                            const match = dialogue.match(/^\[(.*?)\]:\s*(.*)/);
                            if (match) {
                                speaker = match[1];
                                textBlock.push(match[2]);
                            } else {
                                textBlock.push(dialogue);
                            }
                            j++;
                        }
                        
                        const ch = getChapter(seconds);
                        if (currentChapter !== ch.label) {
                            currentChapter = ch.label;
                            const header = document.createElement('div');
                            header.className = 'chapter-header';
                            header.textContent = ch.label;
                            editorBox.appendChild(header);
                        }

                        // Create UI Row
                        const row = document.createElement('div');
                        row.className = 'cue-row';
                        row.dataset.time = seconds;
                        
                        const timeDiv = document.createElement('div');
                        timeDiv.className = 'cue-time';
                        timeDiv.textContent = '▶ ' + startStr.split(/[.,]/)[0];
                        timeDiv.title = "Click to play from here";
                        timeDiv.onclick = () => {
                            audio.currentTime = seconds;
                            audio.play();
                        };

                        const speakerDiv = document.createElement('div');
                        speakerDiv.className = 'cue-speaker';
                        
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.value = speaker;
                        
                        const quickNames = document.createElement('div');
                        quickNames.className = 'quick-names';
                        ch.chars.forEach(name => {
                            const btn = document.createElement('button');
                            btn.textContent = name;
                            btn.onclick = () => input.value = name;
                            quickNames.appendChild(btn);
                        });

                        speakerDiv.appendChild(input);
                        speakerDiv.appendChild(quickNames);

                        const textDiv = document.createElement('div');
                        textDiv.className = 'cue-text';
                        textDiv.textContent = textBlock.join('\n');

                        row.appendChild(timeDiv);
                        row.appendChild(speakerDiv);
                        row.appendChild(textDiv);
                        
                        editorBox.appendChild(row);

                        cues.push({ timeStr, input, textBlock });
                        
                        i = j - 1;
                    }
                }
            };
            reader.readAsText(file);
        });

        document.getElementById('export-btn').addEventListener('click', () => {
            let output = "WEBVTT\n\n";
            cues.forEach(cue => {
                output += cue.timeStr + "\n";
                const speaker = cue.input.value.trim();
                // We add the speaker tag to the first line of the text block
                output += `[${speaker}]: ${cue.textBlock[0]}\n`;
                for (let i = 1; i < cue.textBlock.length; i++) {
                    output += cue.textBlock[i] + "\n";
                }
                output += "\n";
            });
            
            const blob = new Blob([output], { type: 'text/vtt' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Clap_to_Colab3_fixed_speakers.vtt';
            a.click();
        });

        // Highlight active row during playback
        audio.addEventListener('timeupdate', () => {
            const current = audio.currentTime;
            const rows = document.querySelectorAll('.cue-row');
            rows.forEach(r => r.classList.remove('active'));
            
            for (let i = rows.length - 1; i >= 0; i--) {
                if (current >= parseFloat(rows[i].dataset.time)) {
                    rows[i].classList.add('active');
                    // Auto-scroll could go here, but might be annoying if editing
                    break;
                }
            }
        });
    </script>
</body>
</html>
