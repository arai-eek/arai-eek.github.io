<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality Monitor - Pa Rang Cafe, Chiang Mai</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://bernii.github.io/gauge.js/dist/gauge.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Theme 1: Arai-eek Cyber (Default) */
            --theme-primary: #ff2a5f;
            --theme-secondary: #00ff88;
            --theme-primary-rgb: 255, 42, 95;
            --theme-secondary-rgb: 0, 255, 136;
            --theme-bg: #0a0f12;
            --theme-bg-darker: rgba(20, 25, 30, 0.4);
            --theme-text-glow: 0 0 10px rgba(var(--theme-primary-rgb), 0.7);
            --theme-blue-glow: 0 0 10px rgba(var(--theme-secondary-rgb), 0.5),
                        0 0 20px rgba(var(--theme-secondary-rgb), 0.3),
                        0 0 30px rgba(var(--theme-secondary-rgb), 0.1);
            --theme-border: var(--theme-secondary);
            --scale-factor: 0.8;
        }

        [data-theme="logo"] {
            /* Theme 2: Logo Style */
            --theme-primary: #ED1C24; /* Red */
            --theme-secondary: #2E3192; /* Navy */
            --theme-primary-rgb: 237, 28, 36;
            --theme-secondary-rgb: 46, 49, 146;
            --theme-bg: #f0f4f8;
            --theme-bg-darker: #ffffff;
            --theme-text-glow: none;
            --theme-blue-glow: 0 8px 24px rgba(46, 49, 146, 0.08);
            --theme-border: rgba(46, 49, 146, 0.2);
        }

        html {
            height: 100%;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: var(--theme-bg);
            color: var(--theme-secondary);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
            text-shadow: var(--theme-text-glow);
            transform: scale(var(--scale-factor));
            transform-origin: top center;
            height: calc(100% / var(--scale-factor));
            width: calc(100% / var(--scale-factor));
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) scale(var(--scale-factor));
            transition: background-color 0.5s, color 0.5s, text-shadow 0.5s;
        }

        .container {
            max-width: calc(1000px / var(--scale-factor));
            margin: 0 auto;
            padding: 20px;
            background: var(--theme-bg-darker);
            border: 1px solid var(--theme-border);
            box-shadow: var(--theme-blue-glow);
            border-radius: 10px;
            box-sizing: border-box;
            transition: background 0.5s, border-color 0.5s, box-shadow 0.5s;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            color: var(--theme-secondary);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
            font-size: 1.6em;
            text-shadow: 0 0 20px rgba(var(--theme-secondary-rgb), 0.9);
            font-weight: 700;
            line-height: 1.4;
            transition: color 0.5s, text-shadow 0.5s;
        }

        h1 .location {
            display: block;
            color: var(--theme-primary);
            font-size: 0.9em;
            margin-top: 5px;
            text-shadow: var(--theme-text-glow);
            transition: color 0.5s, text-shadow 0.5s;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .last-update {
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--theme-secondary);
            transition: color 0.5s;
        }

        .refresh-button {
            background: var(--theme-bg-darker);
            color: var(--theme-primary);
            border: 1px solid var(--theme-border);
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            margin-left: 10px;
            transition: all 0.3s ease;
        }

        .refresh-button:hover {
            animation: glow 2s infinite;
        }

        @keyframes glow {
            0% { box-shadow: 0 0 10px var(--theme-primary); }
            50% { box-shadow: 0 0 20px var(--theme-secondary); }
            100% { box-shadow: 0 0 10px var(--theme-primary); }
        }

        .data-card {
            background: var(--theme-bg-darker);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--theme-border);
            box-shadow: var(--theme-blue-glow);
            margin-bottom: 20px;
            box-sizing: border-box;
            width: 100%;
            transition: all 0.5s;
        }

        h2 {
            color: var(--theme-secondary);
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.5s;
        }

        .current-values {
            padding: 20px;
        }

        .readings-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 40px;
        }

        .value-card {
            background: var(--theme-bg-darker);
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid var(--theme-border);
            box-shadow: var(--theme-blue-glow);
            min-width: 150px;
            transition: all 0.5s;
        }

        .value-card h3 {
            margin: 0;
            color: var(--theme-primary);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.5s;
        }

        .value-card p {
            margin: 10px 0 0;
            font-size: 1.8em;
            font-weight: bold;
            color: var(--theme-secondary);
            text-shadow: var(--theme-blue-glow);
            transition: all 0.5s;
        }

        .gauge-container {
            text-align: center;
            width: 100%;
            max-width: 300px;
        }

        canvas#tempGauge {
            width: 100% !important;
            height: 200px !important;
            margin: 0 auto;
        }

        .gauge-label {
            margin-top: 10px;
            font-weight: bold;
            color: var(--theme-primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9em;
            transition: color 0.5s;
        }

        #latestTemp {
            margin-top: 5px;
            font-size: 1.8em;
            font-weight: bold;
            color: var(--theme-secondary);
            text-shadow: var(--theme-blue-glow);
            transition: all 0.5s;
        }

        .chart-container {
            position: relative;
            height: 350px;
            background: var(--theme-bg-darker);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--theme-secondary);
            box-shadow: var(--theme-blue-glow);
            width: 100%;
            box-sizing: border-box;
            min-width: 0;
            transition: all 0.5s;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
            width: 100%;
            box-sizing: border-box;
        }

        .chart-wrapper {
            min-width: 0;
            width: 100%;
            box-sizing: border-box;
        }

        @media (max-width: 768px) {
            body {
                --scale-factor: 1;
                transform: none;
                width: 100%;
                height: 100%;
                position: static;
                left: 0;
                padding: 10px;
            }

            .container {
                max-width: 100%;
                padding: 15px;
            }

            .value-card {
                width: 100%;
            }

            .chart-container {
                height: 300px;
                padding: 10px;
            }

            h1 {
                font-size: 1.2em;
            }
        }

        @media (max-width: 620px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 250px;
            }

            .readings-container {
                flex-direction: column;
                gap: 20px;
            }
        }

        #errorContainer {
            color: var(--theme-primary);
            margin-bottom: 20px;
            text-shadow: var(--theme-text-glow);
        }

        #lastUpdateContainer {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8em;
            text-align: center;
            margin-top: 20px;
            color: var(--theme-secondary);
            transition: color 0.5s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-bar">
            <span class="last-update">Last updated: <span id="lastUpdate">Never</span></span>
            <div>
                <button class="refresh-button" onclick="toggleTheme()">Switch Theme</button>
                <button class="refresh-button" onclick="fetchData(true)">Refresh Now</button>
            </div>
        </div>

        <h1>
            Air Quality Data
            <span class="location">Pa Rang Cafe and Art Stay, Chiang Mai</span>
        </h1>
        
        <div id="errorContainer" class="error" style="display: none;">
            <p id="errorMessage"></p>
        </div>

        <div id="dataContainer">
            <div class="data-card">
                <h2>Latest Values</h2>
                <div class="current-values">
                    <div class="readings-container">
                        <div class="value-card">
                            <h3>PM2.5</h3>
                            <p id="latestPM25">Loading...</p>
                        </div>
                        <div class="gauge-container">
                            <canvas id="tempGauge"></canvas>
                            <div class="gauge-label">Temperature</div>
                            <div id="latestTemp">Loading...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-wrapper">
                    <div class="chart-container">
                        <canvas id="pmChartHistory"></canvas>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <div class="chart-container">
                        <canvas id="tempChartHistory"></canvas>
                    </div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="data-card" style="margin-bottom: 0;">
                    <h2>PM2.5 History (28 Days)</h2>
                    <div class="iframe-container" style="position: relative; width: 100%; height: 350px; overflow: hidden; border-radius: 6px; margin-top: 15px;">
                        <iframe id="grafanaIframePM" src="https://api-rrd.madavi.de:3000/grafana/d-solo/GUaL5aZMz/pm-sensors?panelId=14&var-chipID=esp8266-11025538&orgId=1&from=now-28d&to=now&timezone=browser&theme=dark" width="100%" height="100%" frameborder="0" style="position: absolute; top: 0; left: 0;"></iframe>
                    </div>
                </div>

                <div class="data-card" style="margin-bottom: 0;">
                    <h2>Temperature History (28 Days)</h2>
                    <div class="iframe-container" style="position: relative; width: 100%; height: 350px; overflow: hidden; border-radius: 6px; margin-top: 15px;">
                        <iframe id="grafanaIframeTemp" src="https://api-rrd.madavi.de:3000/grafana/d-solo/q87EBfWGk/temperature-humidity-pressure?panelId=8&var-chipID=esp8266-11025538&orgId=1&from=now-28d&to=now&timezone=browser&theme=dark" width="100%" height="100%" frameborder="0" style="position: absolute; top: 0; left: 0;"></iframe>
                    </div>
                </div>
            </div>

            <div id="lastUpdateContainer">
                Last update: <span id="lastUpdateFooter"></span>
            </div>
        </div>

        <script>
            let pmChartHistory = null;
            let tempChartHistory = null;
            let tempGauge = null;

            const PM_SENSOR_ID = "85707";
            const TEMP_SENSOR_ID = "85708";
            const THAILAND_OFFSET = 7 * 60 * 60 * 1000; // 7 hours in ms

            function getThemeColors() {
                const root = document.documentElement;
                const computed = getComputedStyle(root);
                return {
                    primary: computed.getPropertyValue('--theme-primary').trim(),
                    secondary: computed.getPropertyValue('--theme-secondary').trim(),
                    primaryRgb: computed.getPropertyValue('--theme-primary-rgb').trim(),
                    secondaryRgb: computed.getPropertyValue('--theme-secondary-rgb').trim(),
                };
            }

            function toggleTheme() {
                const root = document.documentElement;
                if (root.getAttribute('data-theme') === 'logo') {
                    root.removeAttribute('data-theme');
                } else {
                    root.setAttribute('data-theme', 'logo');
                }
                updateThemeVisuals();
            }

            function updateThemeVisuals() {
                const colors = getThemeColors();
                
                // Update Gauge Options
                if (tempGauge) {
                    const opts = {
                        angle: -0.2,
                        lineWidth: 0.2,
                        radiusScale: 0.9,
                        pointer: {
                            length: 0.6,
                            strokeWidth: 0.035,
                            color: colors.primary
                        },
                        staticLabels: {
                            font: "10px Orbitron",
                            labels: [0, 10, 20, 30, 40],
                            color: colors.secondary,
                            fractionDigits: 0
                        },
                        staticZones: [
                            {strokeStyle: `rgba(${colors.secondaryRgb}, 0.2)`, min: 0, max: 10},
                            {strokeStyle: `rgba(${colors.secondaryRgb}, 0.4)`, min: 10, max: 20},
                            {strokeStyle: `rgba(${colors.secondaryRgb}, 0.6)`, min: 20, max: 30},
                            {strokeStyle: `rgba(${colors.primaryRgb}, 0.8)`, min: 30, max: 40}
                        ],
                        limitMax: false,
                        limitMin: false,
                        highDpiSupport: true,
                        renderTicks: {
                            divisions: 4,
                            divWidth: 1.1,
                            divLength: 0.7,
                            divColor: colors.secondary,
                            subDivisions: 3,
                            subLength: 0.5,
                            subWidth: 0.6,
                            subColor: `rgba(${colors.secondaryRgb}, 0.5)`
                        }
                    };
                    tempGauge.setOptions(opts);
                    // Re-render gauge at current value
                    tempGauge.set(tempGauge.value || 0);
                }

                // Update PM Chart
                if (pmChartHistory) {
                    pmChartHistory.data.datasets[0].borderColor = colors.primary;
                    pmChartHistory.data.datasets[0].pointBackgroundColor = colors.primary;
                    pmChartHistory.data.datasets[0].backgroundColor = `rgba(${colors.primaryRgb}, 0.1)`;
                    pmChartHistory.options.plugins.title.color = colors.secondary;
                    pmChartHistory.options.plugins.legend.labels.color = colors.secondary;
                    pmChartHistory.options.scales.x.ticks.color = colors.secondary;
                    pmChartHistory.options.scales.x.title.color = colors.secondary;
                    pmChartHistory.options.scales.y.ticks.color = colors.secondary;
                    pmChartHistory.options.scales.x.grid.color = `rgba(${colors.secondaryRgb}, 0.1)`;
                    pmChartHistory.options.scales.y.grid.color = `rgba(${colors.secondaryRgb}, 0.1)`;
                    pmChartHistory.update();
                }

                // Update Temp Chart
                if (tempChartHistory) {
                    tempChartHistory.data.datasets[0].borderColor = colors.secondary;
                    tempChartHistory.data.datasets[0].pointBackgroundColor = colors.secondary;
                    tempChartHistory.data.datasets[0].backgroundColor = `rgba(${colors.secondaryRgb}, 0.1)`;
                    tempChartHistory.options.plugins.title.color = colors.secondary;
                    tempChartHistory.options.plugins.legend.labels.color = colors.secondary;
                    tempChartHistory.options.scales.x.ticks.color = colors.secondary;
                    tempChartHistory.options.scales.x.title.color = colors.secondary;
                    tempChartHistory.options.scales.y.ticks.color = colors.secondary;
                    tempChartHistory.options.scales.x.grid.color = `rgba(${colors.secondaryRgb}, 0.1)`;
                    tempChartHistory.options.scales.y.grid.color = `rgba(${colors.secondaryRgb}, 0.1)`;
                    tempChartHistory.update();
                }

                // Update Grafana iframe themes
                const grafanaIframes = ['grafanaIframePM', 'grafanaIframeTemp'];
                grafanaIframes.forEach(id => {
                    const iframe = document.getElementById(id);
                    if (iframe) {
                        const currentSrc = iframe.src;
                        const isLight = document.documentElement.getAttribute('data-theme') === 'logo';
                        const targetTheme = isLight ? 'light' : 'dark';
                        
                        if (currentSrc.includes('theme=') && !currentSrc.includes('theme=' + targetTheme)) {
                            iframe.src = currentSrc.replace(/theme=(dark|light)/, 'theme=' + targetTheme);
                        }
                    }
                });
            }

            function initTempGauge() {
                const target = document.getElementById('tempGauge');
                tempGauge = new Gauge(target);
                tempGauge.maxValue = 40;
                tempGauge.setMinValue(0);
                tempGauge.animationSpeed = 32;
                updateThemeVisuals(); // This will apply options based on current theme
            }

            function createHistoricalPMChart(ctx, data, title) {
                const colors = getThemeColors();
                const chartOptions = {
                    type: 'line',
                    data: {
                        labels: data.timestamp,
                        datasets: [{
                            label: 'PM2.5 (µg/m³)',
                            data: data.pm25,
                            borderColor: colors.primary,
                            backgroundColor: `rgba(${colors.primaryRgb}, 0.1)`,
                            borderWidth: 2,
                            pointRadius: 3,
                            pointBackgroundColor: colors.primary,
                            tension: 0.4,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: title, color: colors.secondary, font: { family: 'Orbitron', size: 14 } },
                            legend: { labels: { color: colors.secondary, font: { family: 'Orbitron' } } }
                        },
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: 'Local Time (UTC+7)',
                                    color: colors.secondary,
                                    font: { family: 'Orbitron', size: 12 }
                                },
                                grid: { color: `rgba(${colors.secondaryRgb}, 0.1)` },
                                ticks: { color: colors.secondary, font: { family: 'Orbitron' } }
                            },
                            y: {
                                grid: { color: `rgba(${colors.secondaryRgb}, 0.1)` },
                                ticks: { color: colors.secondary, font: { family: 'Orbitron' } }
                            }
                        }
                    }
                };
                return new Chart(ctx, chartOptions);
            }

            function createHistoricalTempChart(ctx, data, title) {
                const colors = getThemeColors();
                const chartOptions = {
                    type: 'line',
                    data: {
                        labels: data.timestamp,
                        datasets: [{
                            label: 'Temperature (°C)',
                            data: data.temperature,
                            borderColor: colors.secondary,
                            backgroundColor: `rgba(${colors.secondaryRgb}, 0.1)`,
                            borderWidth: 2,
                            pointRadius: 3,
                            pointBackgroundColor: colors.secondary,
                            tension: 0.4,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: title, color: colors.secondary, font: { family: 'Orbitron', size: 14 } },
                            legend: { labels: { color: colors.secondary, font: { family: 'Orbitron' } } }
                        },
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: 'Local Time (UTC+7)',
                                    color: colors.secondary,
                                    font: { family: 'Orbitron', size: 12 }
                                },
                                grid: { color: `rgba(${colors.secondaryRgb}, 0.1)` },
                                ticks: { color: colors.secondary, font: { family: 'Orbitron' } }
                            },
                            y: {
                                grid: { color: `rgba(${colors.secondaryRgb}, 0.1)` },
                                ticks: { color: colors.secondary, font: { family: 'Orbitron' } }
                            }
                        }
                    }
                };
                return new Chart(ctx, chartOptions);
            }

            async function fetchLiveSensorData(sensorId) {
                try {
                    const response = await fetch(`https://data.sensor.community/airrohr/v1/sensor/${sensorId}/`);
                    if (!response.ok) return null;
                    return await response.json();
                } catch(e) {
                    return null;
                }
            }

            async function fetchData(manualRefresh = false) {
                try {
                    const pmData = await fetchLiveSensorData(PM_SENSOR_ID);
                    const tempData = await fetchLiveSensorData(TEMP_SENSOR_ID);
                    
                    if ((!pmData || pmData.length === 0) && (!tempData || tempData.length === 0)) {
                        throw new Error('Sensor is offline or no data available.');
                    }
                    
                    let latestPM25 = null;
                    let pmTime = null;
                    if (pmData && pmData.length > 0) {
                        const pmSensorValues = pmData[0].sensordatavalues;
                        const p2Obj = pmSensorValues.find(v => v.value_type === 'P2');
                        if (p2Obj) latestPM25 = parseFloat(p2Obj.value);
                        pmTime = new Date(pmData[0].timestamp + 'Z');
                    }
                    
                    let latestTemp = null;
                    let tempTime = null;
                    if (tempData && tempData.length > 0) {
                        const tempSensorValues = tempData[0].sensordatavalues;
                        const tempObj = tempSensorValues.find(v => v.value_type === 'temperature');
                        if (tempObj) latestTemp = parseFloat(tempObj.value);
                        tempTime = new Date(tempData[0].timestamp + 'Z');
                    }

                    if (latestPM25 !== null) {
                        document.getElementById('latestPM25').textContent = `${latestPM25.toFixed(1)} µg/m³`;
                    } else {
                        document.getElementById('latestPM25').textContent = 'N/A';
                    }

                    if (latestTemp !== null) {
                        if (tempGauge) {
                            tempGauge.set(latestTemp);
                        }
                        document.getElementById('latestTemp').textContent = `${latestTemp.toFixed(1)} °C`;
                    } else {
                        document.getElementById('latestTemp').textContent = 'N/A';
                    }

                    let latestTime = pmTime;
                    if (tempTime && (!pmTime || tempTime > pmTime)) latestTime = tempTime;
                    
                    let timeStr = 'Unknown';
                    if (latestTime) {
                        const localD = new Date(latestTime.getTime() + THAILAND_OFFSET);
                        const year = localD.getUTCFullYear();
                        const month = (localD.getUTCMonth() + 1).toString().padStart(2, '0');
                        const day = localD.getUTCDate().toString().padStart(2, '0');
                        const hours = localD.getUTCHours().toString().padStart(2, '0');
                        const mins = localD.getUTCMinutes().toString().padStart(2, '0');
                        timeStr = `${year}-${month}-${day} ${hours}:${mins}`;
                        
                        const now = new Date();
                        const diffMs = now.getTime() - latestTime.getTime();
                        const diffHours = diffMs / (1000 * 60 * 60);
                        if (diffHours >= 48) {
                            timeStr += ` (Offline for ${Math.floor(diffHours / 24)} days)`;
                        } else if (diffHours >= 2) {
                            timeStr += ` (Offline for ${Math.floor(diffHours)} hours)`;
                        }
                    }

                    document.getElementById('lastUpdate').textContent = timeStr;
                    document.getElementById('lastUpdateFooter').textContent = timeStr;
                    document.getElementById('errorContainer').style.display = 'none';
                } catch (error) {
                    console.error('Error:', error);
                    document.getElementById('errorContainer').style.display = 'block';
                    document.getElementById('errorMessage').textContent = error.message;
                    document.getElementById('lastUpdate').textContent = "Offline";
                    document.getElementById('lastUpdateFooter').textContent = "Offline";
                }
            }

            async function getLatestArchiveDate() {
                const res = await fetch("https://archive.sensor.community/");
                if (!res.ok) throw new Error("Failed to fetch archive index");
                const html = await res.text();
                const regex = /href="(202\d-\d\d-\d\d)\/"/g;
                let match;
                const dates = [];
                while ((match = regex.exec(html)) !== null) {
                    dates.push(match[1]);
                }
                if (dates.length === 0) throw new Error("No dates found in archive");
                dates.sort();
                return dates[dates.length - 1]; // latest
            }

            async function getArchiveDataCSV(date, sensorId, type) {
                const url = `https://archive.sensor.community/${date}/${date}_${type}_sensor_${sensorId}.csv`;
                const res = await fetch(url);
                if (!res.ok) return null;
                return await res.text();
            }

            function processCSV(csvText, isPM) {
                const lines = csvText.trim().split('\n');
                const measurements = [];
                for (let i = 1; i < lines.length; i++) {
                    const parts = lines[i].split(';');
                    if (parts.length < 6) continue;
                    const timestampStr = parts[5];
                    const d = new Date(timestampStr + 'Z');
                    
                    let val = null;
                    if (isPM) {
                        if (parts.length > 8 && parts[8].trim() !== '') val = parseFloat(parts[8]);
                        if (val < 0 || val > 1000) val = null;
                    } else {
                        if (parts.length > 9 && parts[9].trim() !== '') val = parseFloat(parts[9]);
                        if (val < -50 || val > 100) val = null;
                    }

                    if (val !== null) {
                        measurements.push({ rawDate: d.getTime(), value: val });
                    }
                }
                
                const unique = new Map();
                for (const m of measurements) {
                    const d = new Date(m.rawDate);
                    const timeLabel = d.toLocaleTimeString('en-GB', {
                        timeZone: 'Asia/Bangkok',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    
                    unique.set(timeLabel, { timeLabel: timeLabel, rawDate: m.rawDate, value: m.value });
                }
                
                const result = Array.from(unique.values());
                result.sort((a, b) => a.rawDate - b.rawDate);
                return result;
            }

            async function fetchHistoricalData() {
                console.log('Fetching historical data...');
                try {
                    const date = await getLatestArchiveDate();
                    console.log(`Latest archive date: ${date}`);
                    
                    const pmCSV = await getArchiveDataCSV(date, PM_SENSOR_ID, 'sps30');
                    const tempCSV = await getArchiveDataCSV(date, TEMP_SENSOR_ID, 'bmp280');
                    
                    if (!pmCSV && !tempCSV) throw new Error("No historical data available");

                    let pmMeasurements = pmCSV ? processCSV(pmCSV, true) : [];
                    let tempMeasurements = tempCSV ? processCSV(tempCSV, false) : [];

                    const combinedMap = new Map();

                    for (const m of pmMeasurements) {
                        combinedMap.set(m.timeLabel, { timeLabel: m.timeLabel, rawDate: m.rawDate, pm25: m.value, temp: null });
                    }
                    
                    for (const m of tempMeasurements) {
                        if (combinedMap.has(m.timeLabel)) {
                            combinedMap.get(m.timeLabel).temp = m.value;
                        } else {
                            combinedMap.set(m.timeLabel, { timeLabel: m.timeLabel, rawDate: m.rawDate, pm25: null, temp: m.value });
                        }
                    }

                    const combinedArray = Array.from(combinedMap.values());
                    combinedArray.sort((a, b) => a.rawDate - b.rawDate);
                    
                    const combinedData = {
                        timestamp: combinedArray.map(c => c.timeLabel),
                        pm25: combinedArray.map(c => c.pm25),
                        temperature: combinedArray.map(c => c.temp)
                    };

                    updateHistoricalCharts(combinedData);
                } catch (e) {
                    console.error('Error fetching historical data:', e);
                }
            }

            function updateHistoricalCharts(data) {
                if (!pmChartHistory) {
                    const pmCtx = document.getElementById('pmChartHistory').getContext('2d');
                    pmChartHistory = createHistoricalPMChart(pmCtx, data, 'PM2.5 - Last 24 Hours');
                } else {
                    pmChartHistory.data.labels = data.timestamp;
                    pmChartHistory.data.datasets[0].data = data.pm25;
                    pmChartHistory.update();
                }

                if (!tempChartHistory) {
                    const tempCtx = document.getElementById('tempChartHistory').getContext('2d');
                    tempChartHistory = createHistoricalTempChart(tempCtx, data, 'Temperature - Last 24 Hours');
                } else {
                    tempChartHistory.data.labels = data.timestamp;
                    tempChartHistory.data.datasets[0].data = data.temperature;
                    tempChartHistory.update();
                }
            }

            // Initialize everything when the page loads
            window.onload = async function() {
                // Initialize the gauge first
                initTempGauge();
                
                // Then fetch the data
                await fetchHistoricalData();
                await fetchData();
                
                // Set up the update intervals
                setInterval(fetchData, 30000);
                setInterval(fetchHistoricalData, 300000);
            };
        </script>
    </div>
</body>
</html>
